[project]
name = "cloudops-evaluations"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "boto3==1.43.97",
    "opentelemetry-sdk==1.44.0",
    "strands-agents==1.20.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
